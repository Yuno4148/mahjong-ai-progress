<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>学習の進み具合</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 並び：上に状態、絞り込み、答え（和了の最新と差）、その下に表と同じ順のグラフ。縦1列。色は、いまのモデルの1色と灰色 */
:root{--bg:#f8f8f6;--fg:#101414;--fg2:#4a5354;--muted:#8a9192;--rule:#e6e7e3;--axis:#c5c7c2;--past:#aeb2ae;
--now:#2a78d6;--a2:#c2620a;--a3:#8250c4;--up:#17703f;--down:#b3402e;
--sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121413;--fg:#eef0ee;--fg2:#b4bbb9;
--muted:#7f8886;--rule:#232726;--axis:#3a403e;--past:#5d6462;--now:#3987e5;--a2:#e8933a;--a3:#a57be8;
--up:#5fc48d;--down:#ee8672;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121413;--fg:#eef0ee;--fg2:#b4bbb9;--muted:#7f8886;--rule:#232726;--axis:#3a403e;
--past:#5d6462;--now:#3987e5;--a2:#e8933a;--a3:#a57be8;--up:#5fc48d;--down:#ee8672;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding-block:20px 64px;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;
background:var(--bg)}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1{font-size:17px;font-weight:600;margin:0 0 8px}h2{font-size:17px;font-weight:600;margin:0 0 4px}
h3{font-size:13px;font-weight:600;margin:16px 0 4px}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 14px;margin:0}
dt{color:var(--fg2)}dd{margin:0;font-weight:600}dd small{font-weight:400;color:var(--fg2);font-size:13px}
table{border-collapse:collapse;width:100%}
th{font-weight:400;color:var(--muted);font-size:11px;text-align:right;padding:2px 0 2px 8px;line-height:1.3}
td{padding:5px 0 5px 8px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid var(--rule)}
td:first-child,th:first-child{text-align:left;padding-left:0}td:first-child{font-weight:600;font-size:13px}
td.n{font-weight:600;font-size:16px}td.up{color:var(--up);font-weight:600}td.down{color:var(--down);font-weight:600}
td.flat{color:var(--fg2)}
.key{font-size:11px;color:var(--fg2);margin:0 0 4px}
.key i{display:inline-block;width:14px;height:2px;margin:0 5px 3px 0;vertical-align:middle}.key i+i{margin-left:12px}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-top:8px}
.rowhead span{font-weight:600}.rowhead b{font-weight:600;font-variant-numeric:tabular-nums}
.grp{margin-bottom:10px}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-size:10px;font-family:var(--sans)}
svg text.seg{fill:var(--fg2);font-size:11px}svg text.nm{fill:var(--fg);font-size:11px}
svg text.num{fill:var(--fg);font-size:11px;font-variant-numeric:tabular-nums}
svg text.end{font-size:11px;font-weight:600}
.pick{position:sticky;top:env(safe-area-inset-top,0px);z-index:1;display:grid;gap:4px;padding:8px 0;
background:var(--bg);border-bottom:1px solid var(--rule)}
.pick div{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pick div.s{grid-template-columns:repeat(5,1fr)}
.hand{font-size:12px;color:var(--fg2);margin:-28px 0 0}
.pick button{font:inherit;font-size:12px;line-height:1;padding:9px 0;color:var(--fg2);background:none;
border:1px solid var(--axis);border-radius:3px}
.pick button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
[hidden]{display:none!important}
</style>
<main id="page"><p class="key">数字を読んでいます</p></main>
<script>
"use strict";
// 学習の進み具合の画面。数字は、同じ場所の data.json（riichienv.ai.solo_report が書く）から読む。
// ここには、見た目と描き方だけを書く。数字の出し方（列・差・最高）は、solo_report.py に書く。
const W = 358, LEFT = 24, RIGHT = 98; // グラフの幅（スマホの中身の幅）と、左右の余白（右は、線の名前と最新の数字）
const INKS = ["var(--now)", "var(--a2)", "var(--a3)"]; // 狙いごとの線の色（狙いの順）
const page = document.getElementById("page");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const f1 = (v) => v.toFixed(1);
const signed = (v) => (v >= 0 ? "+" : "") + v.toFixed(1);
const last = (a) => a[a.length - 1];

// lo〜hi を、切りのいい数で、about 個ほどに刻んだ目盛り
function ticks(lo, hi, about) {
  const raw = Math.max(hi - lo, 1e-9) / about;
  const power = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map((m) => m * power).find((s) => s >= raw);
  const first = Math.ceil(lo / step) * step;
  const out = [];
  for (let i = 0; i <= Math.floor((hi - first) / step + 1e-9); i++) out.push(first + i * step);
  return out;
}

function draw(d) {
  const [x0, x1] = d.span;
  const px = (x) => LEFT + ((x - x0) / (x1 - x0)) * (W - LEFT - RIGHT); // 和了などのグラフの中の、セット x の横の位置
  const dora = Object.fromEntries(d.doras), aim = Object.fromEntries(d.aims);
  const seats = d.seats || [], hand = Object.fromEntries(seats); // 確かめの卓の席と、その配牌
  let v = d; // いま出している中身：全部の席を合わせたもの（d）か、席1つぶん（d.views の1つ）

  // 上の段：項目と値を、1つずつ
  function state() {
    const rows = d.state.map(([k, v, note]) => `<dt>${esc(k)}</dt><dd>${esc(v)}${note ? `<small>　${esc(note)}</small>` : ""}</dd>`);
    return `<dl>${rows.join("")}</dl>`;
  }

  // 絞り込みのボタン：席の段（確かめの卓の席。あれば）と、ドラの出し方の段と、狙いの段。席は、選んだ席の数字に
  // 中身を入れ替える。ドラの出し方と狙いは、選んだ行だけを、表とグラフに残す（「すべて」で戻す）
  function picker() {
    const row = (k, items) =>
      `<div class="${k}"><button data-k="${k}" data-v="">すべて</button>` +
      items.map(([value, name]) => `<button data-k="${k}" data-v="${value}">${esc(name)}</button>`).join("") + "</div>";
    const seat = seats.length ? row("s", seats.map(([name]) => [name, name])) : "";
    return `<nav class="pick">${seat}${row("d", d.doras)}${row("a", d.aims)}</nav>`;
  }

  // いちばん上の答え：和了の9行に、最新の列と、1つ前の列との差と、これまでの最高の列との差。相手がなければ「—」
  function answer() {
    const cell = (g) => (g === null ? '<td class="flat">—</td>' : `<td class="${g.way}">${signed(g.diff)}</td>`);
    const rows = v.answer.map((r) => {
      const tail = r.now === null ? '<td class="flat">—</td>'.repeat(3) : `<td class="n">${f1(r.now)}</td>${cell(r.prev)}${cell(r.best)}`;
      return `<tr data-d="${r.d}" data-a="${r.a}"><td>${dora[r.d]}・${aim[r.a]}</td>${tail}</tr>`;
    });
    return "<table><thead><tr><th></th><th>最新</th><th>1つ前<br>との差</th><th>これまでの<br>最高との差</th></tr></thead>" +
      rows.join("") + "</table>";
  }

  // 凡例：線の色は狙いで決まり、名前はグラフの右に並べてある。ここには、これまでのモデル（灰色）があるときだけ、それを書く
  function key() {
    return d.models.length > 1 ? '<p class="key"><i style="background:var(--past)"></i>これまでのモデル</p>' : "";
  }

  // グラフの頭：確かめの変わり目の右に、その確かめで測ったモデルの名前（いまのモデルの名前）
  function band() {
    if (!d.edges.length) return "";
    const x = px(last(d.edges));
    const [anchor, tx] = x + 11 * d.name.length > W ? ["end", W - RIGHT] : ["start", x + 3];
    return `<svg viewBox="0 0 ${W} 16" role="img"><line x1="${f1(x)}" x2="${f1(x)}" y1="2" y2="16" stroke="var(--axis)"/>` +
      `<text class="seg" x="${f1(tx)}" y="12" text-anchor="${anchor}">${esc(d.name)}</text></svg>`;
  }

  // グラフの下の、横の目盛り（セット）
  function sets() {
    const out = [];
    for (let x = x0; x < x1 - 150; x += 500) out.push(`<text x="${f1(px(x))}" y="10" text-anchor="middle">${x}</text>`);
    out.push(`<text x="${f1(px(x1))}" y="10" text-anchor="end">${x1}</text>`);
    return `<svg viewBox="0 0 ${W} 12" role="img">${out.join("")}</svg>`;
  }

  // ドラの出し方1つぶんのグラフ：横はセット、縦は256回のうちの回数（0から）。狙いごとに線1本（色は狙いで決まる）。
  // これまでのモデルは灰色。測った形の変わり目に縦線。右に、狙いの名前と、いまのモデルの最新の数字。
  // 縦の目盛りの上の端は、peak（同じ形の全部の線の中で、いちばん高い数字）に合わせる。
  function strip(rows, peak, height) {
    const top = 6, floor = height - 5, hi = Math.max(peak * 1.08, 1);
    const py = (v) => top + ((hi - v) / hi) * (floor - top);
    const out = [`<svg viewBox="0 0 ${W} ${height}" role="img">`];
    for (const y of ticks(0, hi, 3)) {
      out.push(`<line x1="${LEFT}" x2="${W - RIGHT}" y1="${f1(py(y))}" y2="${f1(py(y))}" stroke="var(--rule)"/>`);
      out.push(`<text x="${LEFT - 4}" y="${f1(py(y) + 3.5)}" text-anchor="end">${+y.toPrecision(6)}</text>`);
    }
    for (const x of d.edges) // 確かめの変わり目
      out.push(`<line x1="${f1(px(x))}" x2="${f1(px(x))}" y1="0" y2="${floor}" stroke="var(--axis)"/>`);
    const order = d.models.map((m, i) => i).sort((a, b) => d.models[a].current - d.models[b].current);
    for (const row of rows) {
      const color = INKS[d.aims.findIndex(([a]) => a === row.a) % INKS.length];
      out.push(`<g data-d="${row.d}" data-a="${row.a}">`);
      for (const i of order) { // 灰色を下に、いまのモデルを上に
        const cols = row.lines[i], now = d.models[i].current;
        const [ink, width, r] = now ? [color, 2, 2.8] : ["var(--past)", 1.25, 2.2];
        if (cols.length > 1) {
          const path = cols.map(([x, v], k) => `${k ? "L" : "M"}${f1(px(x))},${f1(py(v))}`).join(" ");
          out.push(`<path d="${path}" fill="none" stroke="${ink}" stroke-width="${width}"` +
            ' stroke-linejoin="round" stroke-linecap="round"/>');
        }
        if (now || cols.length === 1)
          for (const [x, v] of cols) out.push(`<circle cx="${f1(px(x))}" cy="${f1(py(v))}" r="${r}" fill="${ink}"/>`);
      }
      out.push("</g>");
    }
    // 右に、狙いの名前と、いまのモデルの最新の数字。どのグラフでも同じ位置に、狙いの順で並べる（数字は右の端でそろえる）
    rows.forEach((row) => {
      const k = d.aims.findIndex(([a]) => a === row.a), y = top + 10 + k * 16;
      out.push(`<g data-d="${row.d}" data-a="${row.a}"><text class="end" x="${W - RIGHT + 10}" y="${y}"` +
        ` style="fill:${INKS[k % INKS.length]}">${aim[row.a]}</text>` +
        `<text class="num" x="${W}" y="${y}" text-anchor="end">${row.now === null ? "—" : f1(row.now)}</text></g>`);
    });
    return out.join("") + "</svg>";
  }

  // 和了・空振り・条件のないリーチの形：ドラの出し方1つが、グラフ1つ（狙い3つを、線3本で重ねる）。1つ目（和了）は、大きく
  function graph(g, index) {
    const height = index === 0 ? 132 : 92;
    let out = `<section><h2>${esc(g.title)}</h2>${band()}`;
    for (const [dv, dn] of d.doras) {
      const rows = g.rows.filter((r) => r.d === dv);
      if (!rows.length) continue;
      out += `<div class="grp" data-d="${dv}"><div class="rowhead"><span>${dn}</span></div>` +
        `${strip(rows, g.peak, height)}${sets()}</div>`;
    }
    return out + "</section>";
  }

  // 役の表：行＝和了・副露・役の1つずつ。行ごとに、横の棒1本。棒の長さ＝いまのモデルの最新の列の回数。
  // 1つ前の列から増えた分は、棒の先を「増えた」の色に、減った分は、棒の先の外に「減った」の色で足す。これまでの
  // 最高（最新の列より前）の位置に、点を1つ。右に、最新の列と、1つ前の列との差。
  // この表で読むのは、手役の行（席ごとのテーマの役を、狙えているか）。だから、横の縮尺は、手役の行（row.hand）の
  // いちばん大きい数字に合わせる。いま出している中身（席1つぶんか、全部の席を合わせたもの）の、全部の表で同じ縮尺
  // （ドラの出し方・狙いの違う表どうしで、同じ役の棒の長さを比べられる）。席ごとに配牌が違い、多い役も違うので、席を
  // またいでは、そろえない（そろえると、ほかの席の多い役に合わせて、この席の棒がつぶれる）。縮尺を超える棒（和了・
  // 立直など）は、右の端で切って、切り口に波線を入れる（回数は、右の数字で読む）。
  function bars(t, top) {
    const nameW = 78, numW = 72, line = 17, thick = 8;
    const x0 = nameW, x1 = W - numW - 6;
    const bx = (value) => x0 + (Math.min(value, top) / top) * (x1 - x0);
    const out = [];
    t.rows.forEach((row, k) => {
      const mid = k * line + line / 2, y = mid - thick / 2;
      const latest = row.latest || 0, prev = row.diff === null ? latest : latest - row.diff;
      const rect = (from, to, ink) => bx(to) - bx(from) > 0.05 &&
        out.push(`<rect x="${f1(bx(from))}" y="${f1(y)}" width="${f1(bx(to) - bx(from))}" height="${thick}" fill="${ink}"/>`);
      out.push(`<line x1="${x0}" x2="${x1}" y1="${mid + line / 2 - 0.5}" y2="${mid + line / 2 - 0.5}" stroke="var(--rule)"/>`);
      out.push(`<text class="nm" x="0" y="${mid + 4}">${esc(row.name)}</text>`);
      rect(0, Math.min(latest, prev), "var(--now)");
      rect(prev, latest, "var(--up)"); // 増えた分
      rect(latest, prev, "var(--down)"); // 減った分
      if (Math.max(latest, prev) > top) // 縮尺を超えた棒：右の端の手前を、地の色の波線2本で切る
        for (const x of [x1 - 10, x1 - 6])
          out.push(`<path d="M${x},${f1(y - 2)} q2,1.5 0,3 q-2,1.5 0,3 q2,1.5 0,3 q-2,1.5 0,3" fill="none"` +
            ' stroke="var(--bg)" stroke-width="1.6"/>');
      if (row.best !== null && row.best !== undefined && row.best <= top)
        out.push(`<circle cx="${f1(bx(row.best))}" cy="${mid}" r="3" fill="var(--fg)" stroke="var(--bg)" stroke-width="1.5"/>`);
      const way = row.diff === null || Math.abs(row.diff) < 0.05 ? "var(--fg2)" : row.diff > 0 ? "var(--up)" : "var(--down)";
      out.push(`<text class="num" x="${W - 40}" y="${mid + 4}" text-anchor="end">${row.latest === null ? "—" : f1(row.latest)}</text>`);
      out.push(`<text class="num" x="${W}" y="${mid + 4}" text-anchor="end" style="fill:${way}">` +
        `${row.diff === null ? "—" : signed(row.diff)}</text>`);
    });
    return `<svg viewBox="0 0 ${W} ${t.rows.length * line}" role="img">${out.join("")}</svg>`;
  }

  // 絞り込みの下の中身：選んだ席の配牌（席を選んだときだけ）、答え、グラフ、役の表
  function body() {
    const top = Math.max(1, ...v.forms.flatMap((t) => t.rows).filter((r) => r.hand)
      .flatMap((r) => [r.latest || 0, r.best || 0, (r.latest || 0) - (r.diff || 0)])); // 役の表の、横の縮尺
    const tables = v.forms.map((t) => `<div data-d="${t.d}" data-a="${t.a}"><h3>${dora[t.d]}・${aim[t.a]}</h3>${bars(t, top)}</div>`);
    return (pick.s ? `<p class="hand">${esc(hand[pick.s])}</p>` : "") +
      `<section><h2>和了</h2>${answer()}</section>${key()}${v.graphs.map(graph).join("")}` +
      `<section><h2>役</h2>${tables.join("")}</section>`;
  }

  // 絞り込み：席（data-k＝s）は、中身を入れ替える。ほかは、押したボタンの値と違う行（data-d＝ドラの出し方、
  // data-a＝狙い）を隠す。選んだ値は、この端末に覚えておく
  const pick = { s: "", d: "", a: "" };
  try {
    const kept = JSON.parse(localStorage.getItem("pick") || "{}");
    if (kept.s in hand) pick.s = kept.s;
    if (kept.d in dora) pick.d = kept.d;
    if (kept.a in aim) pick.a = kept.a;
  } catch (e) { /* 覚えていなくても、「すべて」で出す */ }
  page.innerHTML = `<header><h1>${esc(d.name)}</h1>${state()}</header>${picker()}`;
  function show(fill) {
    if (fill) {
      v = pick.s ? d.views[pick.s] : d;
      while (page.lastElementChild.className !== "pick") page.lastElementChild.remove();
      page.insertAdjacentHTML("beforeend", body());
    }
    for (const b of page.querySelectorAll(".pick button")) b.setAttribute("aria-pressed", pick[b.dataset.k] === b.dataset.v);
    for (const row of page.querySelectorAll("[data-d]")) // SVG の中の線にも効くよう、属性で隠す
      row.toggleAttribute("hidden", Boolean((pick.d && row.dataset.d !== pick.d) || (pick.a && "a" in row.dataset && row.dataset.a !== pick.a)));
  }
  page.querySelector(".pick").addEventListener("click", (e) => {
    const button = e.target.closest("button");
    if (!button) return;
    pick[button.dataset.k] = button.dataset.v;
    try { localStorage.setItem("pick", JSON.stringify(pick)); } catch (err) { /* 覚えられなくても、絞り込みは効く */ }
    show(button.dataset.k === "s");
  });
  show(true);
}

fetch("data.json", { cache: "no-store" })
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
  .then(draw)
  .catch((e) => { page.innerHTML = `<p class="key">数字のファイル（data.json）を読めませんでした（${esc(e.message)}）</p>`; });
</script>
